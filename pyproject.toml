[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "password-manager-v2"
version = "1.0.0"
description = "Local encrypted desktop password manager"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "customtkinter==5.2.2",
    "cryptography==50.0.1",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = [
    "pyinstaller>=6.0",
    "ruff>=0.11",
]

[project.gui-scripts]
password-manager = "password_manager_app:main"

[tool.setuptools]
py-modules = [
    "constants",
    "models",
    "password_manager_app",
    "password_manager_ui",
    "record_window",
    "ui_compat",
]

[tool.setuptools.packages.find]
include = ["utils*"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

name: test

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --windowed --name PasswordManagerV2 --collect-all customtkinter password_manager_app.py
